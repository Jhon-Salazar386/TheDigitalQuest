<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../CSS/Perfil.css">
    <script src="../JavaScript/Perfil.js"></script>
</head>
<body>
    <main>
        <div class="card profile-card shadow-lg border-0 position-relative">

            <a href="../Index.html" class="btn-close position-absolute top-0 end-0 m-3"></a>

            <div class="profile-header"></div>

            <div class="card-body text-center p-4">

                <div class="profile-avatar">
                    <img src="../IMG/login-icon.svg" alt="PerfilImg">
                </div>

                <h4 class="fw-bold mt-3 mb-1" id="userName">!</h4>
                <p class="text-muted small mb-4">Perfil de usuario</p>

                <ul class="list-group list-group-flush text-start">

                    <li class="list-group-item container">
                        <i class="bi bi-person-vcard me-2"></i>
                        <span>DNI: </span>
                        <strong id="dni"></strong>
                    </li>

                    <li class="list-group-item container">
                        <i class="bi bi-calendar-event me-2"></i>
                        <span>Fecha de nacimiento: </span>
                        <strong id="fecha"></strong>
                    </li>
                    <li class="list-group-item container">
                        <i class="bi bi-geo-alt me-2"></i>
                        <span>Ciudad: </span>
                        <strong id="ciudad"></strong>
                    </li>
                    <li class="list-group-item container">
                        <i class="bi bi-telephone me-2"></i>
                        <span>Teléfono: </span>
                        <strong id="telefono"></strong>
                    </li>
                    <li class="list-group-item container">
                        <i class="bi bi-envelope me-2"></i>
                        <span><Strong>Email: </Strong></span>
                        <strong id="email"></strong>
                    </li>
                </ul>

                <div class="d-flex justify-content-center gap-3 mt-4">
                    <button class="btn btn-primary px-4">
                        <i class="bi bi-pencil-square me-1"></i>
                        Editar perfil
                    </button>
                    <button class="btn btn-outline-danger px-4" id="cerrarSesion">
                        <i class="bi bi-box-arrow-right me-1"></i>
                        Cerrar sesión
                    </button>
                </div>

            </div>
        </div>
    </main>
</body>
</html>
