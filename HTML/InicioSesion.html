<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InicioSesion</title>
    <link rel="icon" href="../IMG/Icon.png" type="image/png">
    <link rel="stylesheet" href="../CSS/Formularios.css">
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {

            const usuario = document.getElementById("usuario");
            const contraseña = document.getElementById("contra");
            const iniciar = document.getElementById("iniciarSesion");

            iniciar.addEventListener("click", function(e) {
                e.preventDefault();

                let valorUsuario = usuario.value.trim();
                let valorContraseña = contraseña.value.trim();

                let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];
                let usuarioEncontrado = null;

                if (valorUsuario === "" || valorContraseña === "") {
                    alert("Los campos no pueden estar vacíos");
                    return;
                }

                usuarios.forEach(u => {
                    if ((u.nombre === valorUsuario || u.email === valorUsuario) && u.contraseña === valorContraseña) {
                        usuarioEncontrado = u;
                    }
                });

                if (usuarioEncontrado) {
                    alert("Logueado correctamente");
                    localStorage.setItem("usuarioLogueado", JSON.stringify(usuarioEncontrado));
                    window.location.href = "Index.html";
                } else {
                    alert("Usuario o contraseña incorrectos");
                }
            });
        });

    </script>
    
</head>
<body>
    <header>
        <img src="../IMG/LogoRTS.png" alt="Logo rock the sport" id="Logo">
        <nav>
            <a href="Index.html" id="getback">Volver a la pagina principal</a>
        </nav>
    </header>
    <main>
        <section>
            <form action="Post">
                <h1>Inicio de sesión</h1>
                <label for="usuario">Nombre/Gmail</label>
                <input type="text" class="inputs" placeholder="ingresa tu nombre de usuaio o gmail" required name="usuario" id="usuario"><br>
                <label for="contra">Contraseña</label>
                <input type="password" class="inputs" placeholder="Ingresa una contraseña" required name="contra" id="contra"><br>
                <input type="button" class="botones" value="Iniciar Sesion" id="iniciarSesion">
                <input type="reset" class="botones">
                <a href="Registro.html" id="crearCuenta">¿Crear una cuenta?</a>
            </form>
        </section>
    </main>
    <footer>
        <div>
            <p><strong>Plataforma para gestionar eventos deportivos</strong></p>
        </div>
        <nav class="footer-nav">
            <ul>
                <li class="footer-title">Redes sociales:</li>
                <li><a href="https://www.instagram.com/rockthesport/?hl=es">Instagram</a></li>
                <li><a href="#">Facebook</a></li>
            </ul>
            <ul>
                <li class="footer-title">¿Necesitas ayuda?:</li>
                <li><a href="#">Contáctanos</a></li>
                <li><a href="#">Guía para organizadores</a></li>
            </ul>
        </nav>
        <img src="../IMG/LogoRTS.png" alt="Logo RocktheSport">
    </footer>
</body>
</html>
