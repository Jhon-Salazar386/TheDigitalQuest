<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripciones</title>
    <link rel="stylesheet" href="../CSS/Formularios.css">
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("formInscripcion");
            const usuarioInput = document.getElementById("usuario");
            const contraseñaInput = document.getElementById("ConfirmIncripcion");

            form.addEventListener("submit", function (e) {
                e.preventDefault();

                const user = usuarioInput.value.trim();
                const password = contraseñaInput.value.trim();

                const usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

                const usuarioEncontrado = usuarios.find(u => 
                    (u.nombre === user || u.email === user) && u.contraseña === password
                );

                if (usuarioEncontrado) {
                    alert("Inscripcion emitida correctamente");
                    localStorage.setItem("usuarioLogueado", JSON.stringify(usuarioEncontrado));
                    window.location.href = "Index.html";
                } else {
                    alert("Algo anda mal");
                }
            });
        });
    </script>

</head>
<body>
    <header>
        <a href="Index.html"><img src="../IMG/LogoRTS.png" alt="LogoRTS" id="LogoRTS"></a>
        <nav>
            <a href="Calendario.html" id="regreso">Calendario</a>
            <a href="Index.html" id="regreso">inicio</a>
        </nav>
    </header>
    <main>
        <section>
            <form action="post" id="formInscripcion"><br>
                <h1>Inscribete a una edicion</h1>
                <label for="evento">Evento</label>
                <Select name="evento" id="evento">
                    <option>Trail running(7/1/26)</option>
                    <option>Maraton 10km(14/1/26)</option>
                    <option>Carrera BMX(17/1/26)</option>
                    <option>Trail running(19/1/26)</option>
                </Select>
                <label for="usuario">Usuario</label>
                <input type="text" name="usuario" id="usuario" placeholder="Ingresa tu nombre como deportista" required>
                <label for="ConfirmIncripcion">Verificacion</label>
                <Input type="text" name="ConfirmIncripcion" id="ConfirmIncripcion" placeholder="Ingresa tu contraseña para verificar que eres tu" required>
                <label for="ciudad">Ciudad</label>
                <input type="text" name="ciudad" id="ciudad" placeholder="Ingresa tu Ciudad de nacimiento (Campo opcional)"><br>
                <input type="submit" class="botones" id="inscribirse">
                <input type="reset" class="botones"><br>
                <a href="Registro.html">¿Crear cuenta?</a>
            </form>
        </section>  
    </main>
    <footer>
        <div>
            <p><strong>Plataforma para gestionar eventos deportivos</strong></p>
        </div>
        <nav class="footer-nav">
            <ul>
                <li class="footer-title">Redes sociales:</li>
                <li><a href="https://www.instagram.com/rockthesport/?hl=es">Instagram</a></li>
                <li><a href="#">Facebook</a></li>
            </ul>
            <ul>
                <li class="footer-title">¿Necesitas ayuda?:</li>
                <li><a href="#">Contáctanos</a></li>
                <li><a href="#">Guía para organizadores</a></li>
            </ul>
        </nav>
        <img src="../IMG/LogoRTS.png" alt="Logo RocktheSport">
    </footer>
</body>
</html>
