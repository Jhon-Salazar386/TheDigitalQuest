<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripciones</title>
    <link rel="stylesheet" href="../CSS/Formularios.css">
    <script>
        function alerta(){
            alert("Para poder incribirte, necesitas una cuenta de usuario")
        }
    </script>
</head>
<body>
    <header>
        <img src="../IMG/LogoRTS.png" alt="LogoRTS" id="LogoRTS">
        <nav>
            <a href="Calendario.html" id="regreso">Volver al calendario</a>
        </nav>
    </header>
    <main>
        <form action="post"><br>
            <h2>Inscribete a una edicion</h2>
            <label for="evento">Evento</label>
            <Select name="evento" id="evento">
                <option>Trail running(7/12/25)</option>
                <option>Maraton 10km(14/12/25)</option>
                <option>Carrera BMX(17/12/25)</option>
                <option>Trail running(19/12/25)</option>
            </Select>
            <label for="usuario">Usuario</label>
            <input type="text" name="usuario" id="usuario" placeholder="Ingresa tu nombre como deportista" required>
            <label for="ConfirmIncripcion">Verificacion</label>
            <Input type="text" name="ConfirmIncripcion" id="ConfirmIncripcion" placeholder="Ingresa tu email/telefono de confirmacion" required>
            

            <label for="ciudad">Ciudad</label>
            <input type="text" name="ciudad" id="ciudad" placeholder="Ingresa tu Ciudad de nacimiento (Campo opcional)"><br>
            <input type="submit" class="botones" onclick="alerta()">
            <input type="reset" class="botones"><br>
            <a href="Registro.html">¿Crear cuenta?</a>
        </form>  
    </main>
</body>
</html>
